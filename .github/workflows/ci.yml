name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web

  api:
    name: API import smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-api.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: pip install -r requirements-api.txt httpx --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Import the app and hit /health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          r = TestClient(app).get("/health")
          assert r.status_code == 200, r.text
          print(r.json())
          PY
